##
## Backend Tests
##

    modules.includes.required[relevant]=\
        apps/portal-search,\
        apps/portal-search-elasticsearch7

##
## Functional Tests
##

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk21_zulu][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk21_zulu][relevant]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk21_zulu][relevant]=\
        (test.class.name == Blueprints) OR \
        (test.class.name == SemanticSearch)

    test.batch.run.property.query[functional-upgrade-tomcat*-mysql*-jdk21_zulu][relevant]=\
        (portal.suite.search.engine ~ "elasticsearch7") AND \
        (testray.main.component.name ~ "Upgrades Search")

##
## Playwright
##

    playwright.test.project[playwright-js-tomcat90-mysql57-jdk8][relevant]=search-experiences-web

##
## Testray
##

    testray.main.component.name=Search Experiences